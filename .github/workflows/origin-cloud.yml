name: Origin backend and site

on:
  pull_request:
    paths:
      - "backend/**"
      - "site/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/origin-cloud.yml"
  push:
    paths:
      - "backend/**"
      - "site/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/origin-cloud.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Backend tests, site build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@origin/site..."
      - run: pnpm --filter @origin/backend typecheck
      - run: pnpm test:backend
      - run: pnpm test:site
      - run: pnpm --filter @origin/site build
        env:
          NEXT_PUBLIC_CONVEX_URL: http://127.0.0.1:3210
          NEXT_PUBLIC_CONVEX_SITE_URL: http://127.0.0.1:3211
