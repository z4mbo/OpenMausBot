# Origin desktop builds: the macOS dmg (arm64 + x64) and the Windows NSIS
# installer, uploaded as workflow artifacts. Nothing is published: the files
# are copied to https://origin.imbored.fun/downloads/ by hand, together with
# latest.yml / latest-mac.yml, which the installed apps read for updates.
#
# Signing is optional. Without the secrets below the mac build is ad-hoc
# signed (Gatekeeper asks users to right-click → Open, and macOS in-app
# updates do not install) and the Windows installer is unsigned (SmartScreen
# shows "unknown publisher").
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD    Developer ID Application cert
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   notarytool
name: Origin desktop

on:
  push:
    tags: ["origin-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The updater compares package.json's version, so the tag must name it
        if: startsWith(github.ref, 'refs/tags/origin-v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "origin-v${version}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }

  mac:
    name: macOS (arm64 + x64)
    needs: version
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release-origin

      - name: Import the Developer ID certificate, when provided
        id: cert
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no MAC_CERT_P12_BASE64 secret: building an ad-hoc signed, unnotarized app"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Prepare the app, speech helper and CUA driver
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:cua

      # An unsigned arm64 Electron app whose Info.plist was rewritten no longer
      # matches its linker signature and macOS reports it as damaged; an ad-hoc
      # identity ("-") re-seals it.
      - name: Package both architectures
        env:
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            pnpm exec electron-builder --mac --publish never
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --publish never \
              -c.mac.identity=- -c.dmg.sign=false
          fi

      - name: "Gate: both apps read Origin's update feed"
        run: |
          for app in release-origin/mac-arm64/Origin.app release-origin/mac/Origin.app; do
            update="$app/Contents/Resources/app-update.yml"
            test -f "$update" || { echo "::error::missing $update"; exit 1; }
            grep -Eq '^provider: generic$' "$update" || { echo "::error::$update is not the generic provider"; exit 1; }
            grep -Fq 'url: https://origin.imbored.fun/downloads/' "$update" || { echo "::error::$update has the wrong feed URL"; exit 1; }
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "com.imbored.origin" \
              || { echo "::error::$app has the wrong bundle id"; exit 1; }
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Contents/Info.plist" | grep -qx origin-app \
              || { echo "::error::$app does not register origin-app://"; exit 1; }
            codesign --verify --deep --strict "$app"
          done

      - name: "Gate: both packaged servers start"
        run: |
          for app in release-origin/mac-arm64/Origin.app release-origin/mac/Origin.app; do
            res="$app/Contents/Resources"
            OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
              || { echo "::error::packaged server in $app failed to start"; exit 1; }
            node scripts/check-module-scopes.mjs "$res" || exit 1
          done

      - name: Notarize, staple and refresh the feed, when signed
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::warning::no APPLE_API_KEY_P8_BASE64 secret: signed but not notarized"
            exit 0
          fi
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          for f in release-origin/*.dmg release-origin/*.zip; do
            out=$(xcrun notarytool submit "$f" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              --wait 2>&1)
            echo "$out" | tail -2
            echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization not Accepted for $f"; exit 1; }
          done
          rm "$RUNNER_TEMP/notary.p8"
          v=$(node -p "require('./package.json').version")
          xcrun stapler staple "release-origin/Origin-$v-arm64.dmg"
          xcrun stapler staple "release-origin/Origin-$v-x64.dmg"
          xcrun stapler staple release-origin/mac-arm64/Origin.app
          xcrun stapler staple release-origin/mac/Origin.app
          rm -f "release-origin/Origin-$v-arm64.zip" "release-origin/Origin-$v-x64.zip"
          ditto -c -k --sequesterRsrc --keepParent release-origin/mac-arm64/Origin.app "release-origin/Origin-$v-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent release-origin/mac/Origin.app "release-origin/Origin-$v-x64.zip"
          node scripts/regenerate-blockmaps.mjs \
            "release-origin/Origin-$v-arm64.zip" "release-origin/Origin-$v-x64.zip" \
            "release-origin/Origin-$v-arm64.dmg" "release-origin/Origin-$v-x64.dmg"
          node scripts/regenerate-mac-feed.mjs release-origin/latest-mac.yml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: origin-mac
          path: |
            release-origin/*.dmg
            release-origin/*.zip
            release-origin/*.blockmap
            release-origin/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clean generated output
        shell: bash
        run: rm -rf dist dist-server release-origin
      - run: pnpm package:win
      - name: Verify the bundled browser with an empty home
        run: node scripts/smoke-browser-bundle.mjs --resources "${{ github.workspace }}/release-origin/win-unpacked/resources"
      - name: Verify the packaged server discovers its browser
        env:
          OMB_SMOKE_DIST: ${{ github.workspace }}/release-origin/win-unpacked/resources/server
        run: node scripts/smoke-packaged-server.mjs --browser-bundle "${{ github.workspace }}/release-origin/win-unpacked/resources/browser-engine"
      - name: "Gate: the packaged tree and Origin's update feed"
        shell: bash
        run: |
          res=release-origin/win-unpacked/resources
          v=$(node -p "require('./package.json').version")
          fail=0
          for f in "$res/server/index.js" "$res/server/desktop-entry.mjs" "$res/ui/index.html" \
            "$res/cloudflared/cloudflared.exe" "$res/app-update.yml" release-origin/win-unpacked/Origin.exe \
            "release-origin/Origin-$v-setup.exe" "release-origin/Origin-$v-setup.exe.blockmap" release-origin/latest.yml; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          grep -Eq '^provider: generic$' "$res/app-update.yml" || { echo "::error::app-update.yml is not the generic provider"; fail=1; }
          grep -Fq 'url: https://origin.imbored.fun/downloads/' "$res/app-update.yml" || { echo "::error::app-update.yml has the wrong feed URL"; fail=1; }
          # while the build is unsigned, a publisherName makes electron-updater
          # reject every update as untrusted
          if grep -q "publisherName" "$res/app-update.yml"; then
            echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
          fi
          grep -Fq "path: Origin-$v-setup.exe" release-origin/latest.yml || { echo "::error::latest.yml does not name the installer"; fail=1; }
          cat "$res/app-update.yml" release-origin/latest.yml
          exit $fail
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: origin-windows
          path: |
            release-origin/*.exe
            release-origin/*.exe.blockmap
            release-origin/latest.yml
          if-no-files-found: error
          retention-days: 14
